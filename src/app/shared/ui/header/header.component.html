<mat-toolbar class="header-toolbar">
  <!-- Левая часть: кнопка меню и лого -->
  <div class="header-left">
    <button
      mat-icon-button
      (click)="onToggleSidenav()"
      aria-label="Toggle Menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <span class="logo-title">CRM System</span>
  </div>

  <!-- Центр: Быстрый поиск -->
  <div class="header-search">
    <mat-icon class="search-icon">search</mat-icon>
    <input type="text" placeholder="Поиск клиентов, проектов..." />
  </div>

  <!-- Правая часть: Уведомления и Профиль -->
  <div class="header-right">
    <button mat-icon-button class="icon-btn" aria-label="Notifications">
      <mat-icon
        [matBadge]="unreadNotificationsCount"
        [matBadgeHidden]="unreadNotificationsCount === 0"
        matBadgeColor="warn"
      >
        notifications
      </mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
      @if (currentUser$ | async; as user) {
        <div class="user-avatar-container">
          <div class="user-avatar">
            @if (user.photoURL) {
              <img [src]="user.photoURL" [alt]="user.displayName || 'Пользователь'" />
            } @else {
              <mat-icon class="avatar-icon">person</mat-icon>
            }
          </div>
        </div>
        <span class="user-name">{{ user.displayName || user.email || 'Пользователь' }}</span>
        <span class="dropdown-arrow"><mat-icon>arrow_drop_down</mat-icon></span>
      }
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <button mat-menu-item routerLink="/settings">
        <mat-icon>person</mat-icon>
        <span>Профиль</span>
      </button>
      <button mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Настройки</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon color="warn">exit_to_app</mat-icon>
        <span>Выйти</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
