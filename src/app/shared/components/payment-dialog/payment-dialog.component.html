<div class="dialog-header">
  <h2>Новый платёж</h2>
  <button type="button" class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="paymentForm" (ngSubmit)="save()" class="dialog-body">
  <div class="form-row">
    <div class="form-group">
      <label>Тип *</label>
      <select formControlName="type">
        <option value="income">Доход</option>
        <option value="expense">Расход</option>
      </select>
    </div>
    <div class="form-group">
      <label>Сумма *</label>
      <input type="number" formControlName="amount" min="0.01" step="0.01" placeholder="0" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Дата *</label>
      <input type="date" formControlName="date" />
    </div>
    <div class="form-group">
      <label>Статус *</label>
      <select formControlName="status">
        <option value="completed">Завершён</option>
        <option value="pending">Ожидает</option>
        <option value="failed">Ошибка</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Клиент</label>
      <select formControlName="clientId">
        <option value="">Не указан</option>
        @for (client of clients$ | async; track client.id) {
          <option [value]="client.id">{{ client.name }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label>Проект</label>
      <select formControlName="projectId">
        <option value="">Не указан</option>
        @for (project of projects$ | async; track project.id) {
          <option [value]="project.id">{{ project.title }}</option>
        }
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Описание</label>
    <textarea formControlName="description" rows="3" placeholder="Комментарий к платежу..."></textarea>
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn-secondary" (click)="close()">Отмена</button>
    <button type="submit" [disabled]="paymentForm.invalid || isSaving" class="btn-primary">
      {{ isSaving ? 'Сохранение…' : 'Добавить' }}
    </button>
  </div>
</form>
