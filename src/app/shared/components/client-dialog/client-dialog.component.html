<div class="dialog-header">
  <h2>{{ data?.client ? 'Редактировать клиента' : 'Добавить клиента' }}</h2>
  <button type="button" class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="clientForm" (ngSubmit)="save()" class="dialog-body">
  <div class="form-group">
    <label>Имя / ФИО *</label>
    <input type="text" formControlName="name" placeholder="Иван Иванов" />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="email" placeholder="client@company.com" />
    </div>
    <div class="form-group">
      <label>Телефон</label>
      <input type="tel" formControlName="phone" placeholder="+7 (999) 000-00-00" />
    </div>
  </div>

  <div class="form-group">
    <label>Компания</label>
    <input type="text" formControlName="company" placeholder="ООО Вектор" />
  </div>

  <div class="form-group">
    <label>Заметки</label>
    <textarea formControlName="notes" rows="3" placeholder="Дополнительная информация..."></textarea>
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn-secondary" (click)="close()">Отмена</button>
    <button type="submit" [disabled]="clientForm.invalid" class="btn-primary">
      {{ data?.client ? 'Сохранить' : 'Создать' }}
    </button>
  </div>
</form>
